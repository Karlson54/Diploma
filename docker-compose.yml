services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: timetracker-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P ${DB_PASSWORD} -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timetracker-api
    ports:
      - "5024:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TimeTracker: "Server=sqlserver,1433;Database=TimeTracker;User=SA;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "https://localhost:3000"
      Cors__AllowedOrigins__2: "https://timetracker-silk-three.vercel.app"
      JwtSettings__SecretKey: ${JWT_SECRET}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

volumes:
  sqlserver_data: